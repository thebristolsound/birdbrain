<!-- @dsCard group="Forms" height=140 subtitle="Static rendition of textarea.tsx" -->
<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:var(--color-canvas);color:var(--color-text-secondary);font-family:var(--font-body);font-size:12px;line-height:16px}
  .wrap{padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .eyebrow{font-family:var(--font-display);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--color-text-faint);line-height:1}
  svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
<style>
  .field{width:320px;min-height:72px;resize:vertical;border-radius:var(--radius-md);border:1px solid var(--color-input);background:var(--color-canvas);padding:6px 10px;font:400 12px/16px var(--font-body);color:var(--color-text-primary);outline:none}
  .field::placeholder{color:var(--color-text-faint)} .field:focus{border-color:var(--color-accent)}
</style></head><body>
<div class="wrap"><textarea class="field" placeholder="Describe what this capture shows and why it matters to the case."></textarea></div>
</body></html>
