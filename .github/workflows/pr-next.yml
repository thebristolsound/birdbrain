name: PR next action

# Puts one `next:` label on each open PR naming who acts next, and a `next-action` commit status
# saying why (docs/specs/2026-10-30-pr-next-action-labels-design.md). The rules live in
# .github/scripts/pr-next/next.mjs and reuse merge-gate's own reading of the PR.
#
# Every write uses this workflow's token. GitHub starts no workflow from a label or status that
# token writes, so a changed `next:` label never re-runs merge-gate, the pre-pass gate or the
# PR review job. A label from the machine account would start merge-gate each time; keep the
# token.
#
# workflow_run, pull_request_target and schedule all run from the default branch. The job
# checks out only the scripts and CODEOWNERS from there and reads each PR through the API; it
# never checks out or runs a PR's code.
#
# A finished CI, Merge gate, Merge on label, Pre-pass gate or PR review run relabels the PRs it
# names, or every open PR when it names none (a fork PR, or a push to main). The half-hourly
# fire catches what no workflow reports: a commit status from the reviewer, auto-merge turned
# off, a PR reaching the age when the scheduled review hands it over.

on:
  workflow_run:
    workflows: [CI, Merge gate, Merge on label, Pre-pass gate, PR review]
    types: [completed]
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Optional: one PR number. Empty means every open PR.'
        required: false

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

# One pending run per group, and a pending run reads every PR fresh, so dropping the one it
# replaces loses nothing. No cancelling: a run cut off between removing one label and adding
# the next would leave the PR bare until the next fire.
concurrency:
  group: pr-next-${{ github.event.pull_request.number || join(github.event.workflow_run.pull_requests.*.number, '-') || 'all' }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/CODEOWNERS
            .github/scripts/merge
            .github/scripts/pr-next
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Clear the label from a closed PR
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node .github/scripts/pr-next/next.mjs --clear "$GITHUB_REPOSITORY" "$PR"
      - name: Label the open PRs
        if: github.event_name != 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          BIRDBRAIN_AGENT_GH_LOGIN: ${{ vars.BIRDBRAIN_AGENT_GH_LOGIN }}
          PRS: ${{ inputs.pr || join(github.event.workflow_run.pull_requests.*.number, ' ') }}
        run: |
          # PRS is a space-separated list of numbers, or empty; word splitting is the point.
          # shellcheck disable=SC2086
          node .github/scripts/pr-next/next.mjs "$GITHUB_REPOSITORY" $PRS
