# pnpm settings home (pnpm >= 10.28 no longer reads the "pnpm" field in package.json).
# No `packages` field on purpose: that keeps this a single-package workspace (root only),
# NOT a multi-package workspace — website/ stays an isolated sub-project with its own
# lockfile and its own pnpm-workspace.yaml as a boundary. Do not add a `packages` list.

supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
  - msw
  - sharp

overrides:
  tar: ^7.5.16
