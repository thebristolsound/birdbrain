name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Nothing here pushes; keep the token out of .git/config.
          persist-credentials: false

      # The release tag is not immutable, so the version alone does not pin the
      # binary — verify the tarball against the sha256 recorded from the release's
      # checksums file before executing anything from it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Scans every commit on every ref, not just the pushed branch, so a secret
      # committed to any historical branch fails the build. Known false positives
      # are allowlisted by fingerprint in .gitleaksignore.
      - name: Scan git history
        run: ./gitleaks git --log-opts="--all" --redact --no-banner --verbose

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # No `cache: pnpm` here: this job never installs, so the pnpm store is only
      # present when the cache restore hits. On a lockfile-changing PR the key
      # misses and setup-node's post-run save fails the job on the missing path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Enforcing: the accepted baseline (pnpm-workspace.yaml's `overrides`) is
      # clean of high-severity findings as of 2026-08-05 (#267). A failure here
      # means a dependency bump reintroduced a known-bad version — fix it or add
      # a narrow, dated override; do not restore continue-on-error.
      # See docs/specs/2026-08-05-dependency-advisory-baseline.md for the full
      # per-advisory disposition.
      - name: pnpm audit (root)
        run: pnpm audit --audit-level high

      # website/ is its own pnpm workspace (own lockfile) — see the
      # "Documentation site" section of CLAUDE.md — so it gets its own audit
      # rather than being covered by the root one above.
      #
      # --ignore GHSA-f88m-g3jw-g9cj: sharp < 0.35.0 libvips CVEs, reached only
      # through next's *optional* image-optimization dependency. This site sets
      # `images: { unoptimized: true }` under `output: 'export'`
      # (website/next.config.mjs), so that code path never runs — see the
      # baseline doc above for the full reachability argument. Proposed
      # disposition, not self-certified. Revisit by 2026-11-01 or whenever
      # `next` bumps its declared sharp range past `^0.34.5`, whichever is
      # first, and drop this flag.
      - name: pnpm audit (website)
        working-directory: website
        run: pnpm audit --audit-level high --ignore GHSA-f88m-g3jw-g9cj

  publish-guard:
    name: Registry publish guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Prevents accidental npm/pnpm registry publication (#267): package.json
      # must stay marked private until publication is explicitly approved (at
      # which point this job, not just the field, needs to change). This checks
      # the manifest field directly rather than parsing `pnpm publish --dry-run`
      # output: npm's own `--dry-run` was confirmed (see the baseline doc) to
      # skip the private check entirely and still build a publishable tarball,
      # so a dry-run-based check would have been a false sense of guard.
      - name: Verify package.json is marked private
        run: |
          node -e "
            const pkg = require('./package.json');
            if (pkg.private !== true) {
              console.error('package.json must carry \"private\": true until registry publication is explicitly approved (#267)');
              process.exit(1);
            }
            console.log('OK: package.json is private — npm/pnpm publish is blocked by default');
          "
