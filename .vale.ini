StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = Google
Vocab = Birdbrain

; Lint Mintlify pages with the Markdown parser. mdx2vast is not installed.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Google, Birdbrain

; Calibrated against the house register. Rules below contradict it, so they are off:
Google.We = NO
Google.FirstPerson = NO
Google.Will = NO
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = NO
Google.Passive = NO
Google.Semicolons = NO
Google.Parens = NO
; Asks for "app" where this repository writes "application" (38 hits in the architecture whitepaper).
Google.WordListCase = NO

; The writing guide quotes the words these rules forbid.
[docs/agents/writing-guide.md]
Birdbrain.Filler = NO
Birdbrain.Assurance = NO
Birdbrain.Plain = NO

; The glossary lists the synonyms Birdbrain.Terms rejects.
[CONTEXT.md]
Birdbrain.Terms = NO

; The standards review tabulates the assurance phrases to avoid.
[docs/agents/osint-investigation-standards.md]
Birdbrain.Assurance = NO

; An archived style guide that lists the words these rules forbid.
[docs/archive/writing-style.mdx]
Birdbrain.Filler = NO
Birdbrain.Assurance = NO
Birdbrain.Plain = NO

; Point-in-time records (docs/README.md, "The one exception"): review verdicts, phase-1
; findings, rulings and readings pinned to a commit are evidence of what was read, so the
; blocking rules do not apply to them.
[docs/design-handoff/**/ENGINEERING_REVIEW.md]
Birdbrain.Filler = NO
Birdbrain.Assurance = NO
Birdbrain.Plain = NO
Birdbrain.ThereIs = NO

[docs/design-handoff/**/uploads/*-feasibility-assessment*.md]
Birdbrain.Filler = NO
Birdbrain.Assurance = NO
Birdbrain.Plain = NO
Birdbrain.ThereIs = NO

[docs/{plans,specs}/{2026-08-22-wave2-review-verdict,2026-08-23-wave3-phase1-understand-notes,2026-08-30-exhibit-model-rulings,2026-10-02-verification-procedure-steps,2026-09-28-recapture-identity-masking-research,2026-08-10-design-handoff-feasibility-assessment,2026-05-17-chrome-debugger-tls-spike,2026-07-24-tiptap-dependency-assessment,2026-08-14-two-slot-dispatch-assessment}.md]
Birdbrain.Filler = NO
Birdbrain.Assurance = NO
Birdbrain.Plain = NO
Birdbrain.ThereIs = NO
