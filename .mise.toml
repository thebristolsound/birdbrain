# Pins Node for every shell and agent worktree in this repo (mise ignores .nvmrc by
# default); see the Node note in CLAUDE.md "Commands". Keep in sync with .nvmrc and
# CI's node-version-file.
[tools]
node = "24"
# Vale runs the prose check in .claude/hooks/vale-prose.sh. scripts/install-tools.sh reads this
# pin and installs the same version where mise is absent.
vale = "3.24.0"
