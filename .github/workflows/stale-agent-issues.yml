name: Stale agent issues

# Warns, then closes, issues the machine account (birdbrain-agent) filed that nobody has touched.
# Decision record: docs/adr/0028 rule 4, as amended by docs/adr/0053. An issue untouched for 7
# days gets the `stale` label and a warning; one still untouched at the next weekly run closes as
# "not planned". An issue carrying `queued`, `agent-wip`, `evidence-affecting`, `security`,
# `court-admissibility`, `blocker`, `severity:blocking`, `ready-for-human` or `needs-triage` is
# exempt. The logic and its exempt list live in .github/scripts/stale/run.sh.

on:
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List the issues that would be warned or closed without writing anything'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Warn and close agent-filed issues nobody has touched
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: .github/scripts/stale/run.sh
