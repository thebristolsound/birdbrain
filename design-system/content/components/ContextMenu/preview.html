<!-- @dsCard group="Overlays" height=260 subtitle="Static rendition of context-menu.tsx" -->
<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:var(--color-canvas);color:var(--color-text-secondary);font-family:var(--font-body);font-size:12px;line-height:16px}
  .wrap{padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .eyebrow{font-family:var(--font-display);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--color-text-faint);line-height:1}
  svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
<style>
  .panel{min-width:13rem;max-width:16rem;overflow:hidden;border-radius:var(--radius-md);border:1px solid var(--color-border-strong);background:var(--color-card);padding:4px;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)}
  .hdr{display:flex;align-items:center;gap:8px;margin:-4px -4px 4px;padding:8px 11px;border-bottom:1px solid var(--color-border);background:var(--color-surface)}
  .hdr .ic{color:var(--color-accent);display:flex} .hdr .t{display:block;font-weight:600;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .hdr .s{display:block;font-size:10px;color:var(--color-text-faint)}
  .item{display:flex;width:100%;align-items:center;gap:8px;border-radius:var(--radius);padding:6px 8px;font:400 12px/16px var(--font-body);color:var(--color-text-secondary);background:transparent;border:0;text-align:left;cursor:default}
  .item.hl{background:var(--color-elevated)} .item.danger{color:var(--color-danger-fg)} .item[aria-disabled]{opacity:.45}
  .kbd{margin-left:auto;font:400 10px var(--font-mono);color:var(--color-text-faint)}
  .sep{height:1px;background:var(--color-border);margin:4px 0}
  .foot{margin:4px -4px -4px;width:calc(100% + 8px);border-radius:0;border-top:1px solid var(--color-border);color:var(--color-text-faint)}
</style></head><body>
<div class="wrap">
  <div class="panel" role="menu">
    <div class="hdr" aria-hidden="true"><span class="ic"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg></span><span style="min-width:0;flex:1"><span class="t">example.org/article</span><span class="s">Exhibit 7 · MHTML</span></span></div>
    <button class="item hl" role="menuitem">Open capture<span class="kbd">↵</span></button>
    <button class="item" role="menuitem">Add tag</button>
    <button class="item" role="menuitem">Recapture</button>
    <div class="sep" role="separator"></div>
    <button class="item" role="menuitem" aria-disabled="true">Compare with Wayback</button>
    <button class="item danger" role="menuitem">Delete capture</button>
    <button class="item foot" role="menuitem">Case 7 · 14 exhibits</button>
  </div>
</div>
</body></html>
