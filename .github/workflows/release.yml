name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; each job re-grants only the release write it needs, so the
# token that build/package code can reach is never broader than that job requires.
permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release for the pushed tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this file pushes; keep the token out of .git/config where
          # build/package code running after checkout could read it.
          persist-credentials: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

  build-app:
    needs: create-release
    permissions:
      contents: write # upload packaged installers and updater manifests to the Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest now resolves to a VS 2026 (v18) image that node-gyp <12.1
          # can't detect, breaking the better-sqlite3 native build. Pin to windows-2022
          # until pnpm ships node-gyp >=12.1 (pnpm/pnpm#10268).
          - os: windows-2022
            script: package:win
            glob: |
              dist/*.exe
              dist/*.blockmap
              dist/*.yml
          - os: macos-latest
            script: package:mac
            glob: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/*-mac.yml
          - os: ubuntu-latest
            script: package:linux
            glob: |
              dist/*.{AppImage,deb}
              dist/*-linux.yml

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Python setuptools (needed for node-gyp)
        run: python3 -m pip install --break-system-packages setuptools || pip3 install --break-system-packages setuptools || true

      - run: pnpm install

      - name: Build and package
        run: pnpm ${{ matrix.script }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ${{ matrix.glob }}
          # Fail loudly if any expected artifact (installer, blockmap, or the
          # latest*.yml update manifest) is missing rather than shipping a
          # partial, broken electron-updater feed with no CI signal.
          fail_on_unmatched_files: true

  build-extension:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the extension zip to the Release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build Chrome extension
        run: pnpm build:extension

      - name: Zip extension
        run: mkdir -p dist && cd extension/dist && zip -r ../../dist/birdbrain-extension.zip .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/birdbrain-extension.zip
