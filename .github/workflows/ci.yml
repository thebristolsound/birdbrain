name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` is what makes the draft skip below safe: a PR that spent
    # its whole draft life uncovered gets a full run the moment it is marked ready,
    # which is the only state from which it can be merged.
    types: [opened, reopened, synchronize, ready_for_review]
  # A gate run has to be able to name the commit it is asserting about, and
  # neither push nor pull_request can be aimed at a tag. No inputs are needed:
  # `gh workflow run <file> --ref <tag>` carries the ref itself (#445). A dispatched
  # run clears every gate below on the `github.event_name != 'pull_request'` arm.
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per PR. Agent branches push repeatedly while a 16-minute run is
# still going, and every superseded run was billed in full — one branch cost 9.
# Never cancels on main: those runs are the post-merge record, not a preview.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # apt ships with no retries and no acquire timeout, so a mirror that accepts the
  # connection and then stalls blocks until something else kills the job. Retries
  # are the fix; the timeouts are what make a retry reachable.
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15

# Draft PRs are gated at the `changes` job below, which every other job needs — a
# skipped `changes` skips all five. A draft is not asking to merge, and the author has
# already run the same gates locally (lint, typecheck, test, coverage:diff, build).
#
# `agent-pr` is exempt and must stay exempt: the dispatch routine polls `gh pr checks`
# on a draft agent PR and will not start the reviewer pre-pass until the five ci.yml
# jobs report a conclusion (.claude/skills/dispatch/SKILL.md, "Wait for CI first").
# Skipping CI there would strand that loop. The label is applied at `gh pr create`
# time, so the `opened` event already carries it — which is why `labeled` is not in
# the trigger types above; adding it would run the full matrix on every label change.
jobs:
  # Answers one question for the five jobs below: did this change touch anything the
  # root toolchain builds? Six recent PRs changed only markdown and each paid the full
  # five-job matrix; one branch paid it seven times. Costs ~1 minute to avoid ~16.
  #
  # A workflow-level `paths-ignore:` would be simpler and wrong: the five contexts are
  # required by the `master` ruleset, and a workflow that never runs never reports them,
  # so a docs PR would sit unmergeable forever. Skipping the jobs instead reports them
  # as `skipped`, which the ruleset accepts.
  #
  # Deliberately not gated on push to main: `github.event.before` is unreliable (zeroes
  # on a force push or a new ref), and main is the last check before a release tag.
  changes:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.draft == false
      || contains(github.event.pull_request.labels.*.name, 'agent-pr')
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # The second checkout in this file that keeps its credentials, for the same
      # reason as `test`: the filter step runs `git fetch` and this repo is private,
      # so a fetch without the persisted token fails with "could not read Username".
      # The concern that motivates `persist-credentials: false` elsewhere — pnpm
      # lifecycle scripts and project code reading the token after checkout — does
      # not arise here: this job never installs and runs nothing but git and grep.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"; printf '%s\n' "$changed"
          # Anything outside this list is code. Note .github/workflows is NOT here —
          # a change to CI itself must run CI.
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|website/|\.claude/|\.github/ISSUE_TEMPLATE/|CONTEXT\.md$|LICENSE$|[^/]*\.md$)'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No code paths changed — lint, typecheck, test, build and e2e are skipped.'
          fi

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      # persist-credentials: false on every job except test: no job here pushes, so
      # the token has no reason to sit in .git/config where pnpm lifecycle scripts
      # and test/build code running after checkout could read it. The test job is
      # the one exemption — see the comment on its checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 so diff coverage can resolve a merge base with the base
      # branch; a shallow clone has no common ancestor to diff against.
      #
      # Deliberately NOT persist-credentials: false here, unlike every other
      # checkout in this file: the Diff coverage step runs `git fetch` after
      # checkout, and while this repo is private that fetch only works with the
      # persisted (read-only on fork PRs) token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Retries and acquire timeouts because apt has neither by default: a mirror
      # that accepts the connection and then stops sending blocks forever. On
      # 2026-08-15 that cost the e2e job 19m13s and read as a failing gate (#475).
      - name: Install native build dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y build-essential python3

      - run: pnpm install

      # The canonical RFC 3161 proof (G2) shells out to `openssl ts -verify`.
      # Fail loudly here if openssl is missing so the keystone test can never
      # turn green-but-skipped; BIRDBRAIN_REQUIRE_OPENSSL=1 enforces the same in-test.
      - name: Verify openssl is available
        run: openssl version

      # Runs the suite under coverage so the thresholds in vitest.config.ts are
      # actually evaluated. They were defined long before this and never ran in
      # CI, because `pnpm test` omits --coverage and vitest only checks
      # thresholds when coverage is enabled.
      - run: pnpm test:coverage
        env:
          BIRDBRAIN_REQUIRE_OPENSSL: '1'

      # Project-wide thresholds stop the tree backsliding but cannot ask whether
      # new code arrived tested — a PR can add an untested module and still clear
      # them. This scores only the lines the PR changed.
      - name: Diff coverage
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          node scripts/diff-coverage.mjs --base "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build Electron app
        run: pnpm build

      - name: Build Chrome extension
        run: pnpm build:extension

  e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    # A main-process hang does not crash this job, it makes every spec burn its own
    # timeout: the green job runs ~5m, two runs that wedged in whenReady() ran 2h24m
    # each (32 specs x 3 attempts x ~90s) before anyone noticed. Bound the next one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Whether this list is still needed at all — the runner image ships a
      # baseline — is #476.
      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y build-essential python3 \
            libgtk-3-0 libnotify-dev libnss3 libxss1 \
            libasound2t64 libxtst6 xauth libgbm1 libsecret-1-0

      - run: pnpm install

      # No `playwright install`: the suite is Electron-only (e2e/fixtures/electronApp.ts
      # drives _electron), so the Chromium/Firefox/WebKit downloads were unused, and
      # `--with-deps` ran its own apt-get without APT_OPTS or a step timeout — a mirror
      # stall there consumed the whole 20m job budget four times on 2026-08-18 (#539).
      # xvfb and the Chromium shared libs already ship in the runner image.

      - name: Build app
        run: pnpm build

      - name: Run E2E tests
        run: xvfb-run --auto-servernum npx playwright test
