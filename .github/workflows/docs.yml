name: Docs

# Publishes the Fumadocs site in website/ to GitHub Pages at
# https://thebristolsound.github.io/birdbrain/.
#
# Requires repo Settings -> Pages -> Source: GitHub Actions. The deploy job fails
# until that is set.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages serves one deployment at a time; queue rather than run concurrently.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      # website/ is a deliberately isolated sub-project with its own lockfile — see
      # the note in CLAUDE.md. It is not part of a pnpm workspace, so it installs
      # independently of the Electron app's dependency tree.
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: Build static export
        run: pnpm build
        working-directory: website

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
