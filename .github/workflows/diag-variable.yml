name: Diag variable read

on:
  push:
    branches: [diag/curator-variable-read]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create a marker-holder issue
        continue-on-error: true
        run: |
          set +e
          n="$(gh api "repos/${GITHUB_REPOSITORY}/issues" -X POST \
                -f title='diag: marker holder, delete me' -f body='seed' --jq .number)"
          echo "create rc=$? n=[$n]"
          echo "N=$n" >> "$GITHUB_ENV"

      - name: Write a SHA into the body
        continue-on-error: true
        run: |
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/issues/${N}" -X PATCH \
            -f body='0123456789abcdef0123456789abcdef01234567' --jq .body
          echo "edit rc=$?"

      - name: Read it back
        continue-on-error: true
        run: |
          set +e
          body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${N}" --jq .body)"
          echo "read rc=$? body=[$body]"

      - name: Close it
        continue-on-error: true
        run: |
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/issues/${N}" -X PATCH \
            -f state=closed -f state_reason=not_planned --jq .state
          echo "close rc=$?"
