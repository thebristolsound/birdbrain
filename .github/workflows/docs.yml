name: Docs

# Publishes the Fumadocs site in website/ to GitHub Pages at
# https://thebristolsound.github.io/birdbrain/.
#
# Requires repo Settings -> Pages -> Source: GitHub Actions. The deploy job fails
# until that is set.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least privilege by default. The deployment grants live on the deploy job alone, so
# the build job — which is the one that executes site code — never holds a token that
# can publish to Pages.
permissions:
  contents: read # checkout

# Pages serves one deployment at a time; queue rather than run concurrently.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      # website/ is a deliberately isolated sub-project with its own lockfile — see
      # the note in CLAUDE.md. It is not part of a pnpm workspace, so it installs
      # independently of the Electron app's dependency tree.
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: Build static export
        run: pnpm build
        working-directory: website

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/deploy-pages reads the repository
      pages: write # publish the uploaded artifact to Pages
      id-token: write # OIDC token deploy-pages exchanges for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
