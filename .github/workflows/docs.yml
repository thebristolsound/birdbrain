name: Docs

# Publishes the Fumadocs site in website/ to GitHub Pages at
# https://thebristolsound.github.io/birdbrain/.
#
# Requires repo Settings -> Pages -> Source: GitHub Actions. The deploy job fails
# until that is set.

# Deliberately unfiltered by path. A `paths:` filter looks like an easy saving, but
# it removes any path to automatic recovery from a single bad run: the run that
# failed is the only one that would ever have deployed that content, and no later
# commit re-triggers it. That is exactly what happened — a transient startup failure
# on a Dependabot bump took this workflow down alongside CI and Security. CI and
# Security recovered on the next commit; Docs did not, because that commit touched
# neither website/ nor this file, so the site stayed unpublished until someone
# noticed and dispatched it by hand.
#
# Running on every push to main costs ~2 idle minutes per unrelated commit. It does
# not guarantee a successful publish — the build can still fail, or Pages can be
# unavailable — but it does mean the next commit retries, instead of the site
# staying stale until a human notices.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. The deployment grants live on the deploy job alone, so
# the build job — which is the one that executes site code — never holds a token that
# can publish to Pages.
permissions:
  contents: read # checkout

# Pages serves one deployment at a time; queue rather than run concurrently.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — the build job executes site code but never pushes,
      # so the token has no reason to sit in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      # website/ is a deliberately isolated sub-project with its own lockfile — see
      # the note in CLAUDE.md. It is not part of a pnpm workspace, so it installs
      # independently of the Electron app's dependency tree.
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: Build static export
        run: pnpm build
        working-directory: website

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/deploy-pages reads the repository
      pages: write # publish the uploaded artifact to Pages
      id-token: write # OIDC token deploy-pages exchanges for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
