name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only throughout. Releases are published to the separate public repository
# thebristolsound/birdbrain-releases (see #567) using RELEASES_REPO_TOKEN, so no job
# needs write access to this repository at all — the token build/package code can
# reach through GITHUB_TOKEN stays read-only.
#
# RELEASES_REPO_TOKEN belongs in the `paid-runs` environment, which admits the `v*` tag
# this runs on, so every job that reads it names the environment (#1310; dispatch.yml has
# the note). Unlike the other paid workflows, no job here checks who started the attempt.
permissions:
  contents: read

jobs:
  create-release:
    environment: paid-runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this file pushes; keep the token out of .git/config where
          # build/package code running after checkout could read it.
          persist-credentials: false

      # A release page carries ~17 assets, four of which a tester wants. Generate the
      # download guidance from the tag rather than hand-writing it per release, so the
      # filenames on the page can never drift from the ones actually published (#603).
      - name: Compose release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## About this beta

          **What beta means here.** One thing holds and everything else is rough. The one thing:
          Birdbrain must not silently lose, corrupt, or mis-attest evidence. Screens, wording and
          workflows are changing on purpose; that floor is not.

          **The installers are unsigned.** On Windows, SmartScreen warns about an unrecognized app;
          click **More info**, then **Run anyway**. Code signing lands at the first non-beta release.

          **If a capture turns out not to be what Birdbrain claimed**, the advisory is a pinned issue on
          this repository plus a patched release through the updater. That release reaches Windows and
          AppImage installs in place. A \`.deb\` install updates only on **Restart to update**, so \`.deb\`
          users have to look here.

          **The source is public.** Birdbrain is open source under the MIT license and is built in
          [thebristolsound/birdbrain](https://github.com/thebristolsound/birdbrain). This repository
          holds the builds only.

          ### What to report

          Open an issue on this repository. Report a security vulnerability privately through the
          [source repository's Security tab](https://github.com/thebristolsound/birdbrain/security),
          not in an issue here.

          **Do not report:** layout, spacing, visual design, wording, labels, or a general sense that it
          feels dated. The UI is changing substantially and those decisions are made.

          **Do report:**

          1. Evidence lost, mangled, or mis-described — anything that disappeared, came back different,
             or is described by the app as something other than what it is.
          2. Sites that fail to capture, capture incompletely, or render wrong in the viewer, with the
             URL where it can be shared.
          3. Workflow dead-ends, where you wanted to do something and there was no path. Awkward is not
             a dead-end.
          4. Whether the certification and verify output read as true to someone who would have to
             defend them to a hostile reader.

          ## Which file do I download?

          | You are on | Download |
          | --- | --- |
          | **Windows 10 / 11** | \`Birdbrain-Setup-${VERSION}.exe\` |
          | **Ubuntu** — preferred | \`Birdbrain-${VERSION}.AppImage\` |
          | **Ubuntu** — alternative | \`birdbrain_${VERSION}_amd64.deb\` |
          | **macOS, Apple Silicon** — experimental | \`Birdbrain-${VERSION}-arm64.dmg\` |
          | **macOS, Intel** — experimental | \`Birdbrain-${VERSION}.dmg\` |

          **On Ubuntu, the AppImage needs the execute bit and FUSE 2 before it will run:**

          \`\`\`bash
          chmod +x Birdbrain-${VERSION}.AppImage
          sudo apt install libfuse2t64      # 22.04 and earlier: libfuse2
          ./Birdbrain-${VERSION}.AppImage
          \`\`\`

          Ubuntu stopped installing FUSE 2 by default, and without it the app does not
          start. If you would rather not install it, run the AppImage with
          \`--appimage-extract-and-run\` instead.

          The Chrome extension ships **inside** the app — do not download it separately.
          After installing, use **Open extension folder** in the app and load that folder
          in Chrome, so the extension always matches your app version. (The
          \`birdbrain-extension.zip\` here is the same build, for developers only.)

          \`SHA256SUMS.txt\` lists the SHA-256 of the Windows, macOS, Linux and extension files and
          of the bill of materials, taken from the copies on this page. To check a download
          on Linux, put \`SHA256SUMS.txt\` in the folder that holds it and run
          \`sha256sum --check --ignore-missing SHA256SUMS.txt\`.

          \`birdbrain-${TAG}.spdx.json\` is that bill of materials: GitHub's dependency list
          for the Birdbrain source repository's main branch, in SPDX 2.3 JSON, exported
          during this release's build.

          Everything else on this page (\`latest*.yml\`, \`*.blockmap\`) is machinery for
          the in-app updater. Ignore it.

          **macOS is experimental.** The build is unsigned and not notarized, no machine
          check launches it before it is published, and the app tells you about an update
          but does not install it. macOS blocks the first launch; after dragging Birdbrain
          to Applications, clear the download quarantine once:

          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/Birdbrain.app
          \`\`\`

          **Already running Birdbrain?** You do not need this page. **Settings → Updates →
          Check for updates** finds this version. If the download does not start by itself, click
          **Download**. When it finishes, click **Restart to update**. On the \`.deb\`, that last
          step asks for your system password. After the restart, reload the Birdbrain extension at
          \`chrome://extensions\`, because Chrome keeps the old copy loaded until you do.

          Platform notes, the extension load steps, and where advisories appear:
          [Download Birdbrain](https://docs.birdbrain.cc/docs/download).

          Step by step, from install to first capture:
          [Install and first capture](https://docs.birdbrain.cc/docs/tester-guide).
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The tag is pushed here, but the Release is published in the public
          # releases repository: it is the electron-builder `publish` target in
          # package.json, so it is the feed every installed build's updater reads
          # (#567). The tag does not exist there, so pin where it is cut rather than
          # relying on a default.
          repository: thebristolsound/birdbrain-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          target_commitish: main
          draft: false
          # A literal, not derived from the tag name. ADR-0008 Decision 3: "No release is
          # promoted to a full release while artifacts are unsigned." Change this, and the
          # same input in release-macos.yml, only when that decision's revisit trigger is met:
          #   "A release process that signs every artifact and notarizes macOS builds,
          #   with both verified on the release's actual output — acquiring a
          #   certificate or notarization capability alone does not qualify. Only after
          #   that verification may releases be promoted to full releases and this
          #   restriction be lifted."
          prerelease: true
          body_path: ${{ runner.temp }}/release-notes.md

  build-app:
    needs: create-release
    environment: paid-runs
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest now resolves to a VS 2026 (v18) image that node-gyp <12.1
          # can't detect, breaking the better-sqlite3 native build. Pin to windows-2022
          # until pnpm ships node-gyp >=12.1 (pnpm/pnpm#10268).
          - os: windows-2022
            script: package:win
            smoke: node scripts/package-smoke.mjs
            # latest.yml by name, not dist/*.yml — that also matches electron-builder's
            # builder-debug.yml config dump, which is build debris and publishes runner
            # paths on a public page (#603). The linux leg is already narrow.
            # Every line here is globbed, so a comment inside the block would be an
            # unmatched pattern and fail_on_unmatched_files would fail the run.
            glob: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - os: ubuntu-latest
            script: package:linux
            smoke: xvfb-run --auto-servernum node scripts/package-smoke.mjs
            glob: |
              dist/*.{AppImage,deb}
              dist/*-linux.yml
          # Experimental (#605 removed it, restored as experimental): unsigned, not
          # notarized, and no smoke, since package-smoke.mjs drives win32 and linux only.
          # continue-on-error keeps a failed macOS leg from skipping sbom-and-checksums
          # for the Windows and Linux assets. The release notes carry the macOS rows.
          - os: macos-latest
            script: package:mac
            experimental: true
            glob: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Python setuptools (needed for node-gyp)
        run: python3 -m pip install --break-system-packages setuptools || pip3 install --break-system-packages setuptools || true

      - run: pnpm install

      - name: Build and package
        run: pnpm ${{ matrix.script }}

      # Install (Windows) or run (Ubuntu) the artifact this leg just built and require
      # the capture server to answer: the pre-ship gate's "install -> launch" step, by
      # machine, on the exact bytes about to be published. A leg whose artifact does
      # not boot uploads nothing, so a broken build never reaches the update feed.
      - name: Smoke the packaged app
        if: matrix.smoke
        timeout-minutes: 5
        run: ${{ matrix.smoke }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: thebristolsound/birdbrain-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          files: ${{ matrix.glob }}
          # Fail loudly if any expected artifact (installer, blockmap, or the
          # latest*.yml update manifest) is missing rather than shipping a
          # partial, broken electron-updater feed with no CI signal.
          fail_on_unmatched_files: true

  build-extension:
    needs: create-release
    environment: paid-runs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build Chrome extension
        run: pnpm build:extension

      - name: Zip extension
        run: mkdir -p dist && cd extension/dist && zip -r ../../dist/birdbrain-extension.zip .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: thebristolsound/birdbrain-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          files: dist/birdbrain-extension.zip

  # The bill of materials and the checksum file (#1625). It waits for every build job,
  # so the checksums are taken from the assets as the release serves them. macOS
  # assets attached later by release-macos.yml, to backfill an older tag, are not.
  sbom-and-checksums:
    needs: [build-app, build-extension]
    environment: paid-runs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The workflow token, under this file's contents: read, is the least the export
      # accepts; sbom.sh cites GitHub's documented permission.
      - name: Export the bill of materials
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/release/sbom.sh \
            "$GITHUB_REPOSITORY" "dist/birdbrain-$TAG.spdx.json"

      - name: Upload the bill of materials
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: thebristolsound/birdbrain-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          files: dist/birdbrain-${{ github.ref_name }}.spdx.json
          fail_on_unmatched_files: true

      # After the upload above, so the bill of materials is hashed with the rest.
      - name: Hash every asset on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/release/checksums.sh \
            thebristolsound/birdbrain-releases "$TAG" dist/SHA256SUMS.txt

      - name: Upload the checksum file
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: thebristolsound/birdbrain-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          files: dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
