name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only throughout. Releases are published to the separate public repository
# thebristolsound/birdbrain-releases (see #567) using RELEASES_REPO_TOKEN, so no job
# needs write access to this repository at all — the token build/package code can
# reach through GITHUB_TOKEN stays read-only.
permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job in this file pushes; keep the token out of .git/config where
          # build/package code running after checkout could read it.
          persist-credentials: false

      # A release page carries ~17 assets, four of which a tester wants. Generate the
      # download guidance from the tag rather than hand-writing it per release, so the
      # filenames on the page can never drift from the ones actually published (#603).
      - name: Compose release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Which file do I download?

          | You are on | Download |
          | --- | --- |
          | **Windows 10 / 11** | \`Birdbrain-Setup-${VERSION}.exe\` |
          | **Ubuntu** — preferred | \`Birdbrain-${VERSION}.AppImage\` |
          | **Ubuntu** — alternative | \`birdbrain_${VERSION}_amd64.deb\` |

          **On Ubuntu, the AppImage needs the execute bit and FUSE 2 before it will run:**

          \`\`\`bash
          chmod +x Birdbrain-${VERSION}.AppImage
          sudo apt install libfuse2t64      # 22.04 and earlier: libfuse2
          ./Birdbrain-${VERSION}.AppImage
          \`\`\`

          Ubuntu stopped installing FUSE 2 by default, and without it the app does not
          start. If you would rather not install it, run the AppImage with
          \`--appimage-extract-and-run\` instead.

          The Chrome extension ships **inside** the app — do not download it separately.
          After installing, use **Open extension folder** in the app and load that folder
          in Chrome, so the extension always matches your app version. (The
          \`birdbrain-extension.zip\` here is the same build, for developers only.)

          Everything else on this page (\`latest*.yml\`, \`*.blockmap\`) is machinery for
          the in-app updater. Ignore it.

          **On macOS?** Builds are not published here by default — ask in the tester chat
          and one will be added to this release. They are unsigned, so macOS will refuse
          to open one until you clear it; the tester guide has the command.

          **Already running Birdbrain?** You do not need this page — **Settings → Updates →
          Check for updates** installs this version in place. After it restarts, reload the
          Birdbrain extension at \`chrome://extensions\` — Chrome keeps the old copy loaded
          until you do.

          Full setup instructions, including loading the extension into Chrome:
          [Tester guide](https://thebristolsound.github.io/birdbrain/docs/tester-guide/).
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The tag is pushed here, but the Release is published in the public
          # releases repository — electron-updater's unauthenticated GitHub provider
          # reads that feed, and this repository is private (#567). The tag does not
          # exist there, so pin where it is cut rather than relying on a default.
          repository: thebristolsound/birdbrain-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          target_commitish: main
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          body_path: ${{ runner.temp }}/release-notes.md

  build-app:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # No macOS leg here (#605) — it is a separate, manually dispatched workflow,
          # release-macos.yml. Building it on every tag published 6 of 17 assets (~850MB)
          # on a 10x-billed runner for a platform no round-1 tester was on. Building it
          # never was wrong too, the moment one of them was. Dispatch it per tag that
          # needs it. Do NOT restore it to this matrix without also deciding what the
          # release page should look like for the testers who are not on macOS.
          #
          # windows-latest now resolves to a VS 2026 (v18) image that node-gyp <12.1
          # can't detect, breaking the better-sqlite3 native build. Pin to windows-2022
          # until pnpm ships node-gyp >=12.1 (pnpm/pnpm#10268).
          - os: windows-2022
            script: package:win
            smoke: node scripts/package-smoke.mjs
            # latest.yml by name, not dist/*.yml — that also matches electron-builder's
            # builder-debug.yml config dump, which is build debris and publishes runner
            # paths on a public page (#603). The linux leg is already narrow.
            # Every line here is globbed, so a comment inside the block would be an
            # unmatched pattern and fail_on_unmatched_files would fail the run.
            glob: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - os: ubuntu-latest
            script: package:linux
            smoke: xvfb-run --auto-servernum node scripts/package-smoke.mjs
            glob: |
              dist/*.{AppImage,deb}
              dist/*-linux.yml

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Python setuptools (needed for node-gyp)
        run: python3 -m pip install --break-system-packages setuptools || pip3 install --break-system-packages setuptools || true

      - run: pnpm install

      - name: Build and package
        run: pnpm ${{ matrix.script }}

      # Install (Windows) or run (Ubuntu) the artifact this leg just built and require
      # the capture server to answer: the pre-ship gate's "install -> launch" step, by
      # machine, on the exact bytes about to be published. A leg whose artifact does
      # not boot uploads nothing, so a broken build never reaches the update feed.
      - name: Smoke the packaged app
        timeout-minutes: 5
        run: ${{ matrix.smoke }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: thebristolsound/birdbrain-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          files: ${{ matrix.glob }}
          # Fail loudly if any expected artifact (installer, blockmap, or the
          # latest*.yml update manifest) is missing rather than shipping a
          # partial, broken electron-updater feed with no CI signal.
          fail_on_unmatched_files: true

  build-extension:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build Chrome extension
        run: pnpm build:extension

      - name: Zip extension
        run: mkdir -p dist && cd extension/dist && zip -r ../../dist/birdbrain-extension.zip .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: thebristolsound/birdbrain-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          files: dist/birdbrain-extension.zip
