name: Docs

# Publishes a "moved" notice to GitHub Pages at https://thebristolsound.github.io/birdbrain/.
# The docs themselves are served by Mintlify at https://docs.birdbrain.cc from
# website/content; this workflow only keeps the old address sending visitors there.
# The notice is published as both index.html and 404.html, because Pages answers every
# unknown path with 404.html, so each old page URL reaches the redirect script.
#
# Requires repo Settings -> Pages -> Source: GitHub Actions. The deploy job fails
# until that is set.

# Deliberately unfiltered by path. A `paths:` filter looks like an easy saving, but
# it removes any path to automatic recovery from a single bad run: the run that
# failed is the only one that would ever have deployed that content, and no later
# commit re-triggers it. That is exactly what happened — a transient startup failure
# on a Dependabot bump took this workflow down alongside CI and Security. CI and
# Security recovered on the next commit; Docs did not, because that commit touched
# neither website/ nor this file, so the site stayed unpublished until someone
# noticed and dispatched it by hand.
#
# Running on every push to main costs ~2 idle minutes per unrelated commit. It does
# not guarantee a successful publish — the build can still fail, or Pages can be
# unavailable — but it does mean the next commit retries, instead of the site
# staying stale until a human notices.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. The deployment grants live on the deploy job alone, so
# the build job never holds a token that
# can publish to Pages.
permissions:
  contents: read # checkout

# Pages serves one deployment at a time; queue rather than run concurrently.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — the build job never pushes, so the token has no
      # reason to sit in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble notice
        run: |
          mkdir -p _site
          cp website/pages-notice/index.html _site/index.html
          cp website/pages-notice/index.html _site/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/deploy-pages reads the repository
      pages: write # publish the uploaded artifact to Pages
      id-token: write # OIDC token deploy-pages exchanges for the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
