name: Claude

# Ad hoc review or help from Claude: mention `@claude` in a PR or issue comment,
# a review comment, a review body, or an issue body. Only users with write access
# trigger it (the action's default). Unlike dispatch.yml this is never scheduled
# and takes no dispatch slot: it comments and, when asked, pushes to the PR branch.
#
# GitHub identity is the birdbrain-agent PAT so the reply is posted by the same
# account that authors agent PRs (ADR-0027) and no Claude GitHub App install is
# needed. The Claude credential is the OAuth token dispatch.yml already uses.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.BIRDBRAIN_AGENT_GH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 40
