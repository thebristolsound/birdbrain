name: Merge on label

# The maintainer requests a merge by applying `merge` (ADR-0041). The `request` job composes
# the squash subject and body the way merge-pr does (ADR-0022) and enables GitHub auto-merge as
# the machine account, so GitHub merges once every required check, merge-gate included, is
# green. The machine account performs the merge so the push workflows on main run; a merge
# made with this workflow's own token would not trigger them.
#
# pull_request_target, because the request needs the machine account's secret and Dependabot
# PRs get none under pull_request. Neither job checks out or runs the PR's code: the checkout
# is the default branch, and the PR body is read as data.
#
# The `withdraw` job runs on every push: it removes `approved` and `merge` and turns auto-merge
# off, so a sign-off and a merge request always name the commit that lands.

on:
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: merge-on-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request:
    if: github.event.action == 'labeled' && github.event.label.name == 'merge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/CODEOWNERS
            .claude/skills/merge-pr/scripts
            .claude/skills/post-pr-body/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable auto-merge as the machine account
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_TOKEN: ${{ secrets.BIRDBRAIN_AGENT_GH_TOKEN }}
          AGENT_LOGIN: ${{ vars.BIRDBRAIN_AGENT_GH_LOGIN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SENDER: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          refuse() {
            gh pr edit "$PR" --remove-label merge >/dev/null || true
            printf 'Merge request refused: %s\n\nRemove the cause, then apply the merge label again.\n' "$1" > "$out/comment.md"
            gh pr comment "$PR" --body-file "$out/comment.md"
            echo "refused: $1"
            exit 1
          }
          owner="$(awk '$1=="*" {sub(/^@/,"",$2); print $2; exit}' .github/CODEOWNERS)"
          [ -n "$owner" ] || refuse "the code owners file names no owner"
          [ "$SENDER" = "$owner" ] || refuse "only $owner may request a merge; $SENDER applied the label"
          [ "$DRAFT" = "false" ] || refuse "the pull request is a draft; mark it ready first"
          [ "$BASE" = "main" ] || refuse "the base branch is $BASE, not main"
          [ -n "$AGENT_TOKEN" ] || refuse "the machine account token is not available to this run"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""' > "$out/body.md"
          title="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title)"
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            # Dependabot writes its own body, with no Summary; its first line names the bump.
            printf '%s (#%s)' "$title" "$PR" > "$out/subject.txt"
            awk 'NF {print; exit}' "$out/body.md" > "$out/body.txt"
          else
            .claude/skills/post-pr-body/scripts/check.sh --any-author "$out/body.md" \
              || refuse "the description does not pass the pull request body check"
            node .claude/skills/merge-pr/scripts/compose.mjs "$out/body.md" "$title" "$PR" "$out" >/dev/null \
              || refuse "the description has no Summary section to build the merge message from"
          fi

          login="$(GH_TOKEN="$AGENT_TOKEN" gh api user --jq .login)"
          [ "$login" = "${AGENT_LOGIN:-birdbrain-agent}" ] || refuse "the machine account token authenticates as $login"
          GH_TOKEN="$AGENT_TOKEN" gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --match-head-commit "$SHA" --subject "$(cat "$out/subject.txt")" --body-file "$out/body.txt" \
            || refuse "GitHub would not enable auto-merge; read the pull request's merge box"
          echo "auto-merge enabled at ${SHA:0:12} with subject: $(cat "$out/subject.txt")"

  withdraw:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove the sign-off and the merge request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          set -euo pipefail
          for label in approved merge; do
            case " $LABELS " in
              *" $label "*) gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null && echo "removed $label" ;;
            esac
          done
          auto="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$auto" = "true" ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto
            echo "auto-merge disabled"
          fi
