name: Pre-pass gate

# Seeds the `agent/pre-pass` commit status so a reviewer verdict is visible in the
# merge box, and so the context can eventually be a required check without blocking
# the PRs that never get a pre-pass.
#
# Contract:
#   no agent label                     -> success ("not applicable")
#   `agent-pr` or `agent-authored`      -> pending, until a reviewer posts the verdict
#   PR from a fork                     -> no status, whatever the labels (see below)
#
# Both labels, not just `agent-pr`. `agent-pr` is the strict-serial slot marker, so an
# agent PR opened outside the slot never carries it and wears `agent-authored`
# instead. The #561 decision of 2026-08-18 states that the pre-pass runs on
# `agent-authored` PRs the same as `agent-pr` ones; this workflow was not updated at
# the time. Wave 1 batch 1 is what that cost: five PRs, four of them evidence-affecting,
# all reporting "Not an agent PR" while no reviewer had read a line. A hand-run pre-pass
# on each found twelve blocking defects. Keying on the slot marker alone asks whether a
# PR is in the queue; what the gate needs to know is whether an agent wrote it.
#
# This workflow writes a context that has never reported on this sha, and nothing
# else. The dispatcher (.claude/skills/dispatch/SKILL.md section 4) owns every
# transition after the first, so a posted verdict can never be overwritten here.
#
# That leaves one known gap: a PR that loses the `agent-pr` label while `pending`
# keeps that status, and nothing clears it. Harmless while the context is
# advisory, and a prerequisite for making it required — tracked in #488.
#
# The dispatcher applies `agent-pr` at `gh pr create` time, so the `opened` event
# already sees the label and seeds `pending` directly.
#
# That ordering does not hold off-slot. #674 was labelled after `opened`, so the seed
# had already written the "not applicable" success and write-only-if-absent left it
# there (#501). The re-seed below covers exactly that transition and nothing wider.
#
# NOT YET A REQUIRED CHECK. Workflows triggered by Dependabot get a read-only
# GITHUB_TOKEN under both `pull_request` and `pull_request_target`, so the status
# write below cannot succeed on a Dependabot PR and the context would never report.
# Requiring it today would permanently block every Dependabot PR — 17 opened here
# so far. See the tracking issue before adding it to the ruleset.
#
# PRs from forks are a separate case (#1355). A `pull_request` run from a fork gets
# a read-only GITHUB_TOKEN whatever `permissions:` requests, and the one setting that
# lifts that is offered only for private repositories. Left to run, the write below
# would fail and turn the job red on an external contributor's PR, for a reason
# nothing in their change can fix. So `seed` runs only when the head repository is
# this one, and GitHub reports the skipped job as a success.

on:
  # No `branches:` filter, for the same reason as ci.yml (#763): filtering on `[main]`
  # left a PR stacked on another branch with no gate seeded at all, so an agent PR could
  # carry both labels and still show no `agent/pre-pass` context for a reviewer to be
  # waiting on. Seeding on every base costs one short job per PR.
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  statuses: write

# Label churn can queue several runs against one sha. They would each read then
# write the same context, so serialize them per PR.
concurrency:
  group: pre-pass-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  seed:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Seed agent/pre-pass status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          IS_AGENT: ${{ contains(github.event.pull_request.labels.*.name, 'agent-pr') || contains(github.event.pull_request.labels.*.name, 'agent-authored') }}
        run: |
          set -euo pipefail

          # The combined-status endpoint returns the latest status per context, so
          # this is current state, not history. No `|| true`: a failed read is
          # indistinguishable from "no status yet", and acting on that mistake is
          # how a dispatcher verdict gets overwritten. Fail the job instead. An
          # absent status is still an exit-0 empty string, so the normal path is
          # unaffected.
          # Read state AND description together. The description is what makes the
          # re-seed below safe, so reading it separately would open the window the
          # single read closes.
          current="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" \
            --jq '.statuses[] | select(.context=="agent/pre-pass") | "\(.state)\t\(.description)"')"
          state="${current%%$'\t'*}"
          desc="${current#*$'\t'}"
          [ -n "$current" ] || { state=''; desc=''; }

          NOT_APPLICABLE='Not an agent PR — pre-pass not applicable.'

          # Write when the context has never reported on this sha, and in exactly one
          # other case: this workflow's own "not applicable" success, on a PR that now
          # carries an agent label. That is #501 — a label applied after `opened` left
          # a green badge that write-only-if-absent could never correct, and #674
          # merged wearing one.
          #
          # The guard is the description, not the state. A reviewer verdict is also a
          # `success`, so state alone cannot tell a verdict from a seed. No reviewer
          # writes this exact string, so matching it cannot overwrite a verdict — which
          # is the property 9c8ce66 was protecting when it removed the old
          # success-to-pending transition. There is still no compare-and-swap on the
          # statuses API; what changed is that the only value this can clobber is one
          # this workflow wrote itself.
          if [ -n "$state" ]; then
            if [ "$state" = 'success' ] && [ "$desc" = "$NOT_APPLICABLE" ] && [ "$IS_AGENT" = 'true' ]; then
              echo "agent/pre-pass=success was this workflow's own seed and ${SHA:0:8} is now an agent PR; re-seeding pending"
            else
              echo "agent/pre-pass=$state already set on ${SHA:0:8}; leaving it"
              exit 0
            fi
          fi

          if [ "$IS_AGENT" = "true" ]; then
            new_state=pending
            new_desc='Reviewer pre-pass has not reported for this commit.'
          else
            new_state=success
            new_desc="$NOT_APPLICABLE"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="$new_state" -f context='agent/pre-pass' -f description="$new_desc" >/dev/null
          echo "agent/pre-pass=$new_state on ${SHA:0:8}"
