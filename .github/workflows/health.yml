name: Health

# Daily check that the scheduled automation can still run: the two credentials
# it carries answer, and no scheduled workflow has gone red and stayed red.
# Findings open (or refresh) one `health-alert` issue assigned to the owner and
# fail this run; a clean day closes the issue. Scripts: .github/scripts/health/.
#
# Added 2026-09-23 after the dispatch fire failed 39 times in a row on an
# invalid CLAUDE_CODE_OAUTH_TOKEN and the doc curator every Monday since
# 2026-08-24, with nothing raising either. Runs at 06:20 UTC, ahead of the
# Monday curator (06:00 has a 20-minute skew) and between dispatch fires.

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BIRDBRAIN_AGENT_GH_TOKEN: ${{ secrets.BIRDBRAIN_AGENT_GH_TOKEN }}
          BIRDBRAIN_AGENT_GH_LOGIN: ${{ vars.BIRDBRAIN_AGENT_GH_LOGIN }}
          BIRDBRAIN_AGENT_GH_TOKEN_EXPIRES: ${{ vars.BIRDBRAIN_AGENT_GH_TOKEN_EXPIRES }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_EXPIRES: ${{ vars.CLAUDE_CODE_OAUTH_TOKEN_EXPIRES }}
        run: bash .github/scripts/health/check.sh

      - name: Alert
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ steps.check.outputs.findings }}
        run: bash .github/scripts/health/alert.sh

      # Red in the Actions tab and in GitHub's own failure email, on top of the
      # issue: the issue is the record, the red run is the second channel.
      - name: Fail on findings
        if: steps.check.outputs.findings == 'true'
        run: |
          echo '::error::Health check found problems; see the health-alert issue'
          cat .health/findings.md
          exit 1
