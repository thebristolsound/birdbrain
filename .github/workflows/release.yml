name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

  build-app:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: package:win
            glob: dist/*.exe
          - os: macos-latest
            script: package:mac
            glob: dist/*.dmg
          - os: ubuntu-latest
            script: package:linux
            glob: dist/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Python setuptools (needed for node-gyp)
        run: python3 -m pip install --break-system-packages setuptools || pip3 install --break-system-packages setuptools || true

      - run: pnpm install

      - name: Build and package
        run: pnpm ${{ matrix.script }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.glob }}

  build-extension:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build Chrome extension
        run: pnpm build:extension

      - name: Zip extension
        run: mkdir -p dist && cd extension/dist && zip -r ../../dist/birdbrain-extension.zip .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/birdbrain-extension.zip
