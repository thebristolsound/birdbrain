name: Security

on:
  push:
    branches: [main]
  # No `branches:` filter, for the same reason as ci.yml (#763): a PR stacked on another
  # branch was scanned by nothing, and a secret is worth catching at the push that
  # introduced it whatever that push is based on.
  pull_request:
  # A gate run has to be able to name the commit it is asserting about, and
  # neither push nor pull_request can be aimed at a tag. No inputs are needed:
  # `gh workflow run <file> --ref <tag>` carries the ref itself (#445).
  workflow_dispatch:

permissions:
  contents: read

# Cheap enough to keep running on drafts — a secret is worth catching at the push
# that introduced it, not at review time. Superseded PR runs are still cancelled.
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Nothing here pushes; keep the token out of .git/config.
          persist-credentials: false

      # The release tag is not immutable, so the version alone does not pin the
      # binary — verify the tarball against the sha256 recorded from the release's
      # checksums file before executing anything from it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Scans every commit on every ref, not just the pushed branch, so a secret
      # committed to any historical branch fails the build. Known false positives
      # are allowlisted by content in .gitleaks.toml (read from the repo root) or
      # by fingerprint in .gitleaksignore.
      - name: Scan git history
        run: ./gitleaks git --log-opts="--all" --redact --no-banner --verbose

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No `cache: pnpm` here: this job never installs, so the pnpm store is only
      # present when the cache restore hits. On a lockfile-changing PR the key
      # misses and setup-node's post-run save fails the job on the missing path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Enforcing. Audits the app's dependency tree and fails on any high or
      # critical advisory that is neither cleared by an override in
      # pnpm-workspace.yaml nor covered by an unexpired entry in
      # audit-exceptions.json — so a new advisory, or an accepted one whose expiry
      # has passed, breaks the build. Reads the lockfile, which is why this job
      # still does not install.
      #
      # This replaces the two inline `pnpm audit` steps: an accepted finding lives
      # in a data file with an expiry date rather than in an `--ignore` flag and a
      # comment, so it gets re-decided instead of inherited. The overrides remain
      # the first line of defence — an exception is only for what an override
      # cannot fix. See docs/specs/2026-08-05-dependency-advisory-baseline.md for
      # the per-advisory disposition behind them.
      - name: Dependency advisories
        run: node scripts/audit-check.mjs

  publish-guard:
    name: Registry publish guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Prevents accidental npm/pnpm registry publication (#267): package.json
      # must stay marked private until publication is explicitly approved (at
      # which point this job, not just the field, needs to change). This checks
      # the manifest field directly rather than parsing `pnpm publish --dry-run`
      # output: npm's own `--dry-run` was confirmed (see the baseline doc) to
      # skip the private check entirely and still build a publishable tarball,
      # so a dry-run-based check would have been a false sense of guard.
      - name: Verify package.json is marked private
        run: |
          node -e "
            const pkg = require('./package.json');
            if (pkg.private !== true) {
              console.error('package.json must carry \"private\": true until registry publication is explicitly approved (#267)');
              process.exit(1);
            }
            console.log('OK: package.json is private — npm/pnpm publish is blocked by default');
          "

  font-licences:
    name: Font licence check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Fails when a tracked folder of .woff/.woff2/.ttf/.otf files has no licence
      # file beside it (#1624). It lives here, not in ci.yml: ci.yml's `changes`
      # job classes docs/ as non-code and skips lint, typecheck, test, build and
      # e2e on a pull request that touches only docs/, and two of the committed
      # font folders are under docs/. This workflow has no path filter.
      - name: Every committed font folder carries its licence
        run: node scripts/font-licence-check.mjs
