name: Release (macOS, on request)

# release.yml builds macOS on every release again, as an experimental leg. This
# workflow backfills a macOS build onto an existing Release: one cut before
# the leg returned, or one whose macOS leg failed. It then rewrites the
# release's SHA256SUMS.txt so the checksum file lists the macOS files too.
#
# Run it from the Actions tab, or:
#   gh workflow run release-macos.yml -f tag=v1.0.1-beta.23
#
# The Release must already exist — this workflow adds assets to it and will not
# create one, so a typo'd tag fails loudly instead of publishing a macOS-only
# release nobody expects.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach macOS artifacts to (e.g. v1.0.1-beta.23)'
        required: true
        type: string

# Read-only except for `publish`, as in release.yml (ADR-0047): the job that builds never
# holds a token that can write to this repository.
permissions:
  contents: read

jobs:
  build-macos:
    # Spend guard (#1310), dispatch.yml's cycle guard without the schedule clause; the
    # reasons are there. Main only: a dispatch can name any branch, and `publish` runs
    # that branch's checksums.sh with a token that can write.
    if: github.triggering_actor == 'thebristolsound' && github.ref == 'refs/heads/main'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the tag, not the default branch — the artifacts have to match the
          # release they are being attached to, or the update feed describes bytes
          # that were never built from that source.
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # Fail before spending ~15 macOS minutes if the tag has no Release to attach to.
      - name: Verify the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build and package
        run: pnpm package:mac

      - name: Hand the files to publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  # Uploads the macOS files, then writes the checksum file again (#1625), since it lists
  # the assets on the release when it was written. checksums.sh comes from the ref this
  # workflow runs on, not the tag, which may predate the script.
  publish:
    needs: build-macos
    if: github.triggering_actor == 'thebristolsound' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-macos
          path: dist

      # The release stays a pre-release, as the --prerelease flag in release.yml sets it;
      # the comment there quotes the only condition under which either may change.
      # Uploading adds files and does not change that flag.
      - name: Upload the macOS files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          compgen -G 'dist/latest-mac.yml' >/dev/null ||
            { echo '::error::latest-mac.yml was not built.'; exit 1; }
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Hash every asset on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/release/checksums.sh \
            "$GITHUB_REPOSITORY" "$TAG" dist/SHA256SUMS.txt

      - name: Upload the checksum file
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
