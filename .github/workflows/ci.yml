name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Typecheck main + preload + shared
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Typecheck renderer
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: Typecheck extension
        run: npx tsc --noEmit -p extension/tsconfig.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: pnpm install

      # The canonical RFC 3161 proof (G2) shells out to `openssl ts -verify`.
      # Fail loudly here if openssl is missing so the keystone test can never
      # turn green-but-skipped; BIRDBRAIN_REQUIRE_OPENSSL=1 enforces the same in-test.
      - name: Verify openssl is available
        run: openssl version

      - run: pnpm test
        env:
          BIRDBRAIN_REQUIRE_OPENSSL: '1'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build Electron app
        run: pnpm build

      - name: Build Chrome extension
        run: pnpm build:extension

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 \
            libgtk-3-0 libnotify-dev libnss3 libxss1 \
            libasound2t64 libxtst6 xauth libgbm1 libsecret-1-0

      - run: pnpm install

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Build app
        run: pnpm build

      - name: Run E2E tests
        run: xvfb-run --auto-servernum npx playwright test
