name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter, deliberately. Filtering on `[main]` meant a PR stacked on
  # another PR's branch ran nothing at all — no lint, no typecheck, no test, no build,
  # no e2e — and the author's own reported numbers were the only evidence it had. Four
  # wave-2 PRs merged that way (#712, #713, #714, #715), and #715 put a file that does
  # not parse on a branch with zero checks against it (#763, #783). Stacking is what
  # makes those diffs reviewable, so the answer is to check every base, not to ban it.
  # A stacked run scores its parent's changes too; that is the accepted cost.
  pull_request:
    # `ready_for_review` is what makes the draft skip below safe: a PR that spent
    # its whole draft life uncovered gets a full run the moment it is marked ready,
    # which is the only state from which it can be merged.
    types: [opened, reopened, synchronize, ready_for_review]
  # A gate run has to be able to name the commit it is asserting about, and
  # neither push nor pull_request can be aimed at a tag. No inputs are needed:
  # `gh workflow run <file> --ref <tag>` carries the ref itself (#445). A dispatched
  # run clears every gate below on the `github.event_name != 'pull_request'` arm.
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per PR. Agent branches push repeatedly while a 16-minute run is
# still going, and every superseded run was billed in full — one branch cost 9.
# Never cancels on main: those runs are the post-merge record, not a preview.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # apt ships with no retries and no acquire timeout, so a mirror that accepts the
  # connection and then stalls blocks until something else kills the job. Retries
  # are the fix; the timeouts are what make a retry reachable.
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
  # Drop Azure's Ubuntu mirror before apt ever sees it. When it goes dark, apt burns
  # most of a step's timeout failing over to archive.ubuntu.com and then has none left
  # to install — the cap meant to stop a hang instead kills a run that was recovering
  # (#620, and the same mirror behind #475 and #539). Failing over up front costs
  # nothing when Azure is healthy. Interpolated into every apt step so the two cannot
  # drift apart.
  #
  # The target is /etc/apt/apt-mirrors.txt, NOT sources.list: the runner image points
  # its sources at `mirror+file:/etc/apt/apt-mirrors.txt` and lists the hosts there, so
  # rewriting sources.list edits a file that names no mirror and changes nothing. A run
  # of this workflow with the sources.list version still fetched from Azure throughout —
  # verified in the e2e job log, which is the only thing that distinguishes "the rewrite
  # worked" from "Azure happened to be healthy".
  #
  # Rewrite rather than delete the line: the file may list Azure alone, and an empty
  # mirrorlist breaks apt outright. A duplicated archive.ubuntu.com entry is inert.
  DROP_AZURE_MIRROR: >-
    sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g'
    /etc/apt/apt-mirrors.txt 2>/dev/null || true

# Draft PRs are gated at the `changes` job below, which every other job needs — its
# gate step leaves the job's outputs empty, which skips all six. A draft is not asking to merge, and the author has
# already run the same gates locally (lint, typecheck, test, coverage:diff, build).
#
# `agent-pr` is exempt and must stay exempt: the dispatch routine polls `gh pr checks`
# on a draft agent PR and will not start the reviewer pre-pass until the six ci.yml
# jobs report a conclusion (.claude/skills/dispatch/SKILL.md, "Wait for CI first").
# Skipping CI there would strand that loop. (`skipped` is itself a conclusion, which is
# why `docs-build` skipping on a PR that touches no docs does not.)
#
# The labels are read from the API, not from the event payload. `gh pr create --label`
# creates the PR and labels it in a second call, so the `opened` payload can carry no
# labels, and a `labeled` event is not a trigger here: every CI job on #1747 skipped
# that way, the #784 failure after its fix. Adding `labeled` would not help either: a
# later label change would start a run whose skipped jobs replace the green ones.
#
# `agent-authored` is exempt for the same reason. It is the off-slot marker (#561):
# an agent PR that does not hold the strict-serial slot never carries `agent-pr`, so
# keying only on the slot marker left every off-slot agent draft with no CI at all
# and no reviewer waiting on it. Both labels mean an agent wrote the diff, which is
# what this exemption is actually about.
jobs:
  # Answers two questions for the six jobs below. `code`: did this change touch anything
  # the root toolchain builds? Six recent PRs changed only markdown and each paid the full
  # five-job matrix; one branch paid it seven times. Costs ~1 minute to avoid ~16.
  # `website`: does the docs site need compiling? — see `docs-build` at the end of the file.
  #
  # A workflow-level `paths-ignore:` would be simpler and wrong: the five contexts are
  # required by the `master` ruleset, and a workflow that never runs never reports them,
  # so a docs PR would sit unmergeable forever. Skipping the jobs instead reports them
  # as `skipped`, which the ruleset accepts.
  #
  # Deliberately not gated on push to main: `github.event.before` is unreliable (zeroes
  # on a force push or a new ref), and main is the last check before a release tag.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      # The draft gate. A draft without an agent label stops here, and every job below
      # skips on the empty outputs. The second read covers the gap between the PR's
      # creation and its labels; a non-agent draft pays those 20 seconds.
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$DRAFT" != true ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0
          fi
          for attempt in 1 2; do
            labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '[.[].name]')"
            echo "Labels (read $attempt): $labels"
            if jq -e 'index("agent-pr") or index("agent-authored")' <<< "$labels" > /dev/null; then
              echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$attempt" -eq 1 ]; then sleep 20; fi
          done
          echo 'run=false' >> "$GITHUB_OUTPUT"
          echo '::notice::Draft without an agent label - lint, typecheck, test, build and e2e are skipped.'

      # The second checkout in this file that keeps its credentials, for the same
      # reason as `test`: the filter step runs `git fetch` and this repo is private,
      # so a fetch without the persisted token fails with "could not read Username".
      # The concern that motivates `persist-credentials: false` elsewhere — pnpm
      # lifecycle scripts and project code reading the token after checkout — does
      # not arise here: this job never installs and runs nothing but git and grep.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - id: filter
        if: github.event_name == 'pull_request' && steps.gate.outputs.run == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"; printf '%s\n' "$changed"
          # Anything outside this list is code. Note .github/workflows is NOT here —
          # a change to CI itself must run CI.
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|website/|\.claude/|\.github/ISSUE_TEMPLATE/|CONTEXT\.md$|LICENSE$|[^/]*\.md$)'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No code paths changed — lint, typecheck, test, build and e2e are skipped.'
          fi
          # This file is in the docs-site list for the same reason .github/workflows is
          # absent from the code list above: `docs-build` is defined here, so a change to
          # it must run it. Without that, the job's first real execution would be on some
          # later website/ PR, and an environment fault in it would fail a change that had
          # nothing to do with it.
          if printf '%s\n' "$changed" | grep -qE '^(website/|\.github/workflows/ci\.yml$)'; then
            echo 'website=true' >> "$GITHUB_OUTPUT"
          else
            echo 'website=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Nothing under website/ changed — docs-build is skipped.'
          fi

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      # persist-credentials: false on every job except test: no job here pushes, so
      # the token has no reason to sit in .git/config where pnpm lifecycle scripts
      # and test/build code running after checkout could read it. The test job is
      # the one exemption — see the comment on its checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - run: pnpm lint

      - run: pnpm lint:boundaries

      - run: pnpm lint:agents-md

  typecheck:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    outputs:
      coverage-lines: ${{ steps.coverage-badge.outputs.lines }}
    steps:
      # fetch-depth: 0 so diff coverage can resolve a merge base with the base
      # branch; a shallow clone has no common ancestor to diff against.
      #
      # Deliberately NOT persist-credentials: false here, unlike every other
      # checkout in this file: the Diff coverage step runs `git fetch` after
      # checkout, and while this repo is private that fetch only works with the
      # persisted (read-only on fork PRs) token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Retries and acquire timeouts because apt has neither by default: a mirror
      # that accepts the connection and then stops sending blocks forever. On
      # 2026-08-15 that cost the e2e job 19m13s and read as a failing gate (#475).
      - name: Install native build dependencies
        timeout-minutes: 5
        run: |
          ${{ env.DROP_AZURE_MIRROR }}
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y build-essential python3

      - run: pnpm install

      # The canonical RFC 3161 proof (G2) shells out to `openssl ts -verify`.
      # Fail loudly here if openssl is missing so the keystone test can never
      # turn green-but-skipped; BIRDBRAIN_REQUIRE_OPENSSL=1 enforces the same in-test.
      - name: Verify openssl is available
        run: openssl version

      # Runs the suite under coverage so the thresholds in vitest.config.ts are
      # actually evaluated. They were defined long before this and never ran in
      # CI, because `pnpm test` omits --coverage and vitest only checks
      # thresholds when coverage is enabled.
      - run: pnpm test:coverage
        env:
          BIRDBRAIN_REQUIRE_OPENSSL: '1'

      - name: Read measured line coverage
        id: coverage-badge
        run: node scripts/coverage-badge.mjs measure >> "$GITHUB_OUTPUT"

      # Project-wide thresholds stop the tree backsliding but cannot ask whether
      # new code arrived tested — a PR can add an untested module and still clear
      # them. This scores only the lines the PR changed.
      - name: Diff coverage
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          node scripts/diff-coverage.mjs --base "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

  # Only successful main pushes publish the measured coverage. Pull requests exercise
  # measurement and its tests, but never get a publishing token. The separate branch
  # holds only public badge data; it does not change the source or trigger another CI run.
  coverage-badge:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Publish line coverage
        run: node scripts/coverage-badge.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_LINES: ${{ needs.test.outputs.coverage-lines }}

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build Electron app
        run: pnpm build

      - name: Build Chrome extension
        run: pnpm build:extension

      # Every packaging run writes the third-party notice before electron-builder and stops
      # when a production package has no licence text and no override (#1364). Running it here
      # puts that stop on the pull request that brings the package in, not on release day. This
      # runner is Linux, so a gap in another platform's native package still first shows when
      # that platform packages.
      - name: Third-party notices
        run: pnpm build:notices

  e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    # A main-process hang does not crash this job, it makes every spec burn its own
    # timeout: the green job runs ~5m, two runs that wedged in whenReady() ran 2h24m
    # each (32 specs x 3 attempts x ~90s) before anyone noticed. Bound the next one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Whether this list is still needed at all — the runner image ships a
      # baseline — is #476.
      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          ${{ env.DROP_AZURE_MIRROR }}
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y build-essential python3 \
            libgtk-3-0 libnotify-dev libnss3 libxss1 \
            libasound2t64 libxtst6 xauth libgbm1 libsecret-1-0

      - run: pnpm install

      # No `playwright install`: the suite is Electron-only (e2e/fixtures/electronApp.ts
      # drives _electron), so the Chromium/Firefox/WebKit downloads were unused, and
      # `--with-deps` ran its own apt-get without APT_OPTS or a step timeout — a mirror
      # stall there consumed the whole 20m job budget four times on 2026-08-18 (#539).
      # xvfb and the Chromium shared libs already ship in the runner image.

      - name: Build app
        run: pnpm build

      - name: Run E2E tests
        run: xvfb-run --auto-servernum npx playwright test

  # Checks the docs site on PRs that change it. Mintlify builds website/content only
  # after a merge to main, so a broken internal link or a missing image would otherwise
  # pass every PR check and surface on the live site (#450 was the same failure under
  # the old Fumadocs build). `mint broken-links` reads docs.json and every page, and
  # exits non-zero on a link or image path that resolves to nothing.
  #
  # A job skipped by `if:` still reports `skipped`, which the ruleset accepts, so the
  # context can be required without blocking PRs that touch nothing under website/.
  # The job keeps its old name for that reason: the required-contexts list lives in
  # the `master` ruleset, not in this repository.
  #
  # The CLI runs through `pnpm dlx` at a pinned version rather than as a root
  # dependency, so it never enters the app's lockfile or the packaged build. pnpm also
  # skips the CLI's dependency build scripts, which include Scarf install analytics;
  # `npx` runs them, and a local `npm install` of it hung on 2026-09-29.
  docs-build:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.website == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check links
        run: pnpm dlx mint@4.2.952 broken-links
        working-directory: website/content

      # `mint broken-links` passes a relative link such as `./download.mdx`, which
      # Mintlify does not resolve in production. Checked 2026-09-29.
      - name: Reject relative links
        run: |
          if grep -rnE '\]\(\.{1,2}/' --include='*.mdx' website/content; then
            echo '::error::Use root-relative links such as /docs/download in website/content.'
            exit 1
          fi
