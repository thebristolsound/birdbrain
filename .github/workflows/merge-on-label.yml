name: Merge on label

# The maintainer requests a merge by applying `merge` (ADR-0041). The `request` job composes
# the squash subject and body the way merge-pr does (ADR-0022) and enables GitHub auto-merge as
# the machine account, so GitHub merges once every required check, merge-gate included, is
# green. The machine account performs the merge so the push workflows on main run; a merge
# made with this workflow's own token would not trigger them.
#
# pull_request_target, because the request needs the machine account's secret and Dependabot
# PRs get none under pull_request. Neither job checks out or runs the PR's code: the checkout
# is the default branch, and the PR body is read as data.
#
# Auto-merge stays armed only while the request stands:
# - `withdraw`, on every push, removes `approved` and `merge` and turns auto-merge off, so a
#   sign-off and a merge request always name the commit that lands. merge-gate also needs the
#   `merge/approved` stamp on the current head, so a failed withdraw does not reopen the door.
# - `cancel`, when `merge` is removed, turns auto-merge off.
# - `reject`, when anyone but the maintainer applies `merge`, removes it and says why. It reads
#   no secret, so it needs no spend guard. Authorization reads the label's sender, never
#   triggering_actor, which names whoever re-ran the attempt.
# - `stamp`, when the maintainer applies `approved`, posts a `merge/approved` status on the
#   commit that was the head when the label went on. merge-gate counts the label only with that
#   stamp on the current head, so the sign-off names one commit however the head later moves.
#   An `approved` from anyone else is removed.
#
# No concurrency group: GitHub keeps one pending run per group and cancels the rest, which could
# drop a withdrawal queued behind a request. Each run instead reconciles what it acts on: the
# request re-reads the label and arms auto-merge only for the head it was labelled at.
# - `issue-evidence`, when an issue gains `evidence-affecting`, cancels the merge request of
#   every open PR that closes it: merge-gate cannot see an issue label change until it next runs.
#
# `withdraw`, `cancel` and `issue-evidence` take contents: write. Without it GitHub refuses to
# turn auto-merge off ("Resource not accessible by integration"), and a push left it armed
# (#1753, 2026-10-07). None of them checks out code, so the wider token writes only what the
# step's own gh calls do.

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize]
  issues:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  request:
    # The spend guard (#1310): a job that reads a stored secret runs only when the maintainer
    # started the attempt. The step below also refuses any other label sender, with a comment.
    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'merge' && github.triggering_actor == 'thebristolsound'
    environment: paid-runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .nvmrc
            .github/CODEOWNERS
            .claude/skills/merge-pr/scripts
            .claude/skills/post-pr-body/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable auto-merge as the machine account
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_TOKEN: ${{ secrets.BIRDBRAIN_AGENT_GH_TOKEN }}
          AGENT_LOGIN: ${{ vars.BIRDBRAIN_AGENT_GH_LOGIN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SENDER: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          refuse() {
            gh pr edit "$PR" --remove-label merge >/dev/null || true
            printf 'Merge request refused: %s\n\nRemove the cause, then apply the merge label again.\n' "$1" > "$out/comment.md"
            gh pr comment "$PR" --body-file "$out/comment.md"
            echo "refused: $1"
            exit 1
          }
          owner="$(awk '$1=="*" {sub(/^@/,"",$2); print $2; exit}' .github/CODEOWNERS)"
          [ -n "$owner" ] || refuse "the code owners file names no owner"
          [ "$SENDER" = "$owner" ] || refuse "only $owner may request a merge; $SENDER applied the label"
          [ "$DRAFT" = "false" ] || refuse "the pull request is a draft; mark it ready first"
          [ "$BASE" = "main" ] || refuse "the base branch is $BASE, not main"
          [ -n "$AGENT_TOKEN" ] || refuse "the machine account token is not available to this run"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""' > "$out/body.md"
          title="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title)"
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            # Dependabot writes its own body, with no Summary; its first line names the bump.
            printf '%s (#%s)' "$title" "$PR" > "$out/subject.txt"
            awk 'NF {print; exit}' "$out/body.md" > "$out/body.txt"
          else
            .claude/skills/post-pr-body/scripts/check.sh --any-author "$out/body.md" \
              || refuse "the description does not pass the pull request body check"
            node .claude/skills/merge-pr/scripts/compose.mjs "$out/body.md" "$title" "$PR" "$out" >/dev/null \
              || refuse "the description has no Summary section to build the merge message from"
          fi

          # The run may have queued behind a removal; enable nothing the maintainer took back.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' | grep -qx merge \
            || { echo "the merge label is gone; nothing enabled"; exit 0; }
          login="$(GH_TOKEN="$AGENT_TOKEN" gh api user --jq .login)"
          [ "$login" = "${AGENT_LOGIN:-birdbrain-agent}" ] || refuse "the machine account token authenticates as $login"
          GH_TOKEN="$AGENT_TOKEN" gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --match-head-commit "$SHA" --subject "$(cat "$out/subject.txt")" --body-file "$out/body.txt" \
            || refuse "GitHub would not enable auto-merge; read the pull request's merge box"
          echo "auto-merge enabled at ${SHA:0:12} with subject: $(cat "$out/subject.txt")"

  reject:
    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'merge' && github.event.sender.login != 'thebristolsound'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove a merge request the maintainer did not make
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label merge >/dev/null
          printf 'Merge request removed: only the maintainer may request a merge, and %s applied the label.\n' "$SENDER" > comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md

  stamp:
    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stamp the sign-off on the labelled commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          if [ "$SENDER" != "thebristolsound" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label approved >/dev/null
            printf 'Sign-off removed: only the maintainer may approve, and %s applied the label.\n' "$SENDER" > comment.md
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=merge/approved \
            -f description="Signed off by $SENDER on this commit" >/dev/null
          echo "stamped merge/approved on ${SHA:0:12}"

  cancel:
    if: github.event_name == 'pull_request_target' && github.event.action == 'unlabeled' && github.event.label.name == 'merge'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Turn auto-merge off
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          auto="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$auto" = "true" ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto
            echo "auto-merge disabled"
          fi

  issue-evidence:
    if: github.event_name == 'issues' && github.event.label.name == 'evidence-affecting'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel merge requests on PRs that close this issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Only a first line starting "Closes" names closed issues, as merge-gate reads it.
          prs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" | jq -r --arg n "$ISSUE" '
            .[] | ((.body // "") | split("\n")[0] // "") as $first
            | select(($first | startswith("Closes ")) and ($first | test("#" + $n + "\\b")))
            | .number')"
          for pr in $prs; do
            labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/labels" --jq '.[].name')"
            if printf '%s\n' "$labels" | grep -qx merge; then
              gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --remove-label merge >/dev/null
              echo "#$pr: removed merge"
            fi
            auto="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [ "$auto" = "true" ]; then
              gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --disable-auto
              printf 'Merge request cancelled: issue #%s is now evidence-affecting, so this change needs the maintainer sign-off before it merges.\n' "$ISSUE" > comment.md
              gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            fi
          done

  withdraw:
    if: github.event_name == 'pull_request_target' && github.event.action == 'synchronize'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove the sign-off and the merge request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          set -euo pipefail
          for label in approved merge; do
            case " $LABELS " in
              *" $label "*) gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$label" >/dev/null && echo "removed $label" ;;
            esac
          done
          auto="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$auto" = "true" ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto
            echo "auto-merge disabled"
          fi
