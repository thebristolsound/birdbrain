name: Doc curator

# Weekly reconciliation of website/content/docs/**.mdx against what merged to main.
# An author model proposes the edit; scripts/doc-budget.mjs fences it; a separate
# reviewer model judges it; only an approved, site-building edit becomes a PR. Policy and limits:
# docs/agents/doc-curator.md. Decision record: docs/adr/0012.
#
# The window is <marker>..HEAD. The marker is the body of issue #795, and is a bare
# 40-character SHA. Not a committed file, so a run never has to commit to main to
# remember itself. The marker advances only on a PR, a comment on the open curator
# PR, or a clean no-op — a discarded run leaves it so the next run retries the same
# window.
#
# It used to be the repository variable DOC_CURATOR_LAST_SHA, which never worked:
# GITHUB_TOKEN cannot read or write Actions variables, whatever `permissions:` says,
# and there is no scope in that block which grants it. Every run failed at "Collect
# window" reporting the 403 as "unset" (#792). A git tag was the other candidate and
# is worse: creating one is allowed, but moving it is refused whenever
# `.github/workflows/**` differs between the old and new target, because GITHUB_TOKEN
# has no `workflows` permission — and moving it weekly is the entire job. An issue
# body needs only `issues: write`, which this workflow already holds, and its edit
# history is a free audit trail of every window the curator has run.
#
# Never pushes to main: docs.yml publishes every push there straight to Pages.

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run everything but do not open a PR, comment, or advance the marker'
        type: boolean
        default: true

permissions:
  contents: write # push the docs/curate-* branch
  pull-requests: write # open or comment on the curator PR
  issues: write # file the site-build-failure issue, and read/advance the marker issue

concurrency:
  group: doc-curator
  cancel-in-progress: false

jobs:
  curate:
    # Spend guard (#1310), the same as dispatch.yml's cycle job, environment included;
    # the reasons and the limits are there.
    if: >-
      (github.event_name == 'schedule' && github.run_attempt == '1')
      || github.triggering_actor == 'thebristolsound'
    environment: paid-runs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      # The issue whose body holds the marker SHA. See the header comment.
      MARKER_ISSUE: 795
      AUTHOR_MODEL: claude-opus-5
      REVIEWER_MODEL: claude-fable-5
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.288

      - name: Collect window
        id: window
        run: |
          set -euo pipefail
          # No `|| true` and no `2>/dev/null`. A read that fails must fail the step: an
          # error swallowed into the empty string is indistinguishable from a marker that
          # was never set, and reporting the first as the second is what sent four manual
          # dispatches chasing a variable that was fine (#792).
          raw="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${MARKER_ISSUE}" --jq '.body')"
          # Keep the unresolved value in its own variable. `rev-parse --quiet` assigns the
          # empty string when it fails, so validating in place would print "[]" as the bad
          # value — losing the only thing an operator needs to fix it.
          candidate="$(printf '%s' "$raw" | tr -d '[:space:]')"
          # A marker that names no commit is a configuration error, not an empty window.
          # Without this the `git log` below writes to stderr, yields the empty string, and
          # the no-op branch reports "nothing to curate" with exit 0 — so a bad marker makes
          # the curator look healthy while doing nothing, every week, forever (#793).
          if ! marker="$(git rev-parse --verify --quiet "${candidate}^{commit}")"; then
            echo "Marker in issue #${MARKER_ISSUE} does not resolve to a commit: [${candidate}]" >&2
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          # Standalone assignment, so `set -e` sees a git failure here. Inline in the `[`
          # test below it would be swallowed exactly like the case above.
          commits="$(git log --oneline "$marker..$head")"
          if [ "$marker" = "$head" ] || [ -z "$commits" ]; then
            echo "no_merges=true" >> "$GITHUB_OUTPUT"
            echo "No commits since $marker; nothing to curate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "no_merges=false" >> "$GITHUB_OUTPUT"
          mkdir -p .curator
          git log --merges --format='%H %s' "$marker..$head" > .curator/merges.txt
          # PR bodies say why; the diff says what. Both go to the author.
          gh pr list --state merged --base main --limit 100 \
            --json number,title,body,mergeCommit,mergedAt \
            --jq "[.[] | select(.mergedAt > \"$(git show -s --format=%cI "$marker")\")]" \
            > .curator/prs.json
          # A curator PR already open means step 6 of the policy: comment, don't open.
          gh pr list --state open --label agent-pr --label documentation --search 'head:docs/curate-' \
            --json number --jq '.[0].number // empty' > .curator/open_pr.txt || true

      - name: Author
        if: steps.window.outputs.no_merges == 'false'
        id: author
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CURATOR_MARKER: ${{ steps.window.outputs.marker }}
        run: |
          set -euo pipefail
          date_tag="$(date -u +%F)"
          echo "date_tag=$date_tag" >> "$GITHUB_OUTPUT"
          bash .github/scripts/doc-curator/author.sh ""
          node scripts/doc-budget.mjs --json > .curator/budget.json || true
          jq -r '.failures[] | "FAIL [\(.rule)] \(.path): \(.detail)"' .curator/budget.json || true

      - name: Review
        if: steps.window.outputs.no_merges == 'false'
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CURATOR_MARKER: ${{ steps.window.outputs.marker }}
        run: |
          set -euo pipefail
          verdict="$(bash .github/scripts/doc-curator/review.sh)"
          if [ "$verdict" != "approve" ]; then
            echo "First pass rejected; retrying once with reviewer reasons." | tee -a "$GITHUB_STEP_SUMMARY"
            git checkout -- website/content/docs
            rm -f .curator/stray.txt .curator/budget.json
            bash .github/scripts/doc-curator/author.sh "$(jq -r '.reasons | join("\n- ")' .curator/verdict.json)"
            node scripts/doc-budget.mjs --json > .curator/budget.json || true
            verdict="$(bash .github/scripts/doc-curator/review.sh)"
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- website/content/docs; then has_edit=false; else has_edit=true; fi
          echo "has_edit=$has_edit" >> "$GITHUB_OUTPUT"
          {
            echo "## Reviewer verdict: $verdict"
            jq -r '.reasons[] | "- " + .' .curator/verdict.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" != "approve" ]; then
            git checkout -- website/content/docs
            echo "Discarded. Marker left at ${{ steps.window.outputs.marker }}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build site on the edit
        if: steps.review.outputs.verdict == 'approve' && steps.review.outputs.has_edit == 'true'
        id: build
        working-directory: website/content
        continue-on-error: true
        run: |
          set -euo pipefail
          pnpm dlx mint@4.2.952 broken-links 2>&1 | tee ../../.curator/build.log

      - name: File build-failure issue
        if: steps.review.outputs.verdict == 'approve' && steps.build.outcome == 'failure' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          gh issue create --label documentation --label agent-pr \
            --title "doc-curator: site build failed on curated edit ($(date -u +%F))" \
            --body-file <(printf 'The doc curator produced an approved edit that failed `mint broken-links` in `website/content/`. Edit discarded; marker left at %s.\n\nRun: %s/%s/actions/runs/%s\n\n```\n%s\n```\n' \
              "${{ steps.window.outputs.marker }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(tail -c 6000 .curator/build.log)")
          echo "Site build failed on the edit; issue filed, edit discarded." >> "$GITHUB_STEP_SUMMARY"

      - name: Open or comment PR
        if: steps.review.outputs.verdict == 'approve' && steps.build.outcome != 'failure' && env.DRY_RUN != 'true'
        id: pr
        run: |
          set -euo pipefail
          bash .github/scripts/doc-curator/publish.sh "${{ steps.author.outputs.date_tag }}" "${{ steps.window.outputs.marker }}" "${{ steps.window.outputs.head }}"

      - name: Advance marker
        if: env.DRY_RUN != 'true' && (steps.window.outputs.no_merges == 'true' || steps.pr.outcome == 'success')
        env:
          NEW_MARKER: ${{ steps.window.outputs.head }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${MARKER_ISSUE}" -X PATCH \
            -f body="$NEW_MARKER" --jq '.number' > /dev/null
          # Read it back. A PATCH that reports success but leaves the body unchanged would
          # make the next run redo this window and open a second PR over the same commits.
          written="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${MARKER_ISSUE}" --jq '.body' \
            | tr -d '[:space:]')"
          if [ "$written" != "$NEW_MARKER" ]; then
            echo "Marker did not advance: wanted $NEW_MARKER, issue #${MARKER_ISSUE} holds [$written]" >&2
            exit 1
          fi
          echo "Marker advanced to $NEW_MARKER." >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: env.DRY_RUN == 'true' && steps.window.outputs.no_merges == 'false'
        run: |
          {
            echo "## Dry run — nothing published, marker untouched"
            echo '```diff'
            git diff -- website/content/docs | head -c 20000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.window.outputs.no_merges == 'false'
        with:
          name: curator-run
          path: .curator/
          if-no-files-found: ignore
