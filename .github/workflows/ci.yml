name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false on every job except test: no job here pushes, so
      # the token has no reason to sit in .git/config where pnpm lifecycle scripts
      # and test/build code running after checkout could read it. The test job is
      # the one exemption — see the comment on its checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so diff coverage can resolve a merge base with the base
      # branch; a shallow clone has no common ancestor to diff against.
      #
      # Deliberately NOT persist-credentials: false here, unlike every other
      # checkout in this file: the Diff coverage step runs `git fetch` after
      # checkout, and while this repo is private that fetch only works with the
      # persisted (read-only on fork PRs) token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: pnpm install

      # The canonical RFC 3161 proof (G2) shells out to `openssl ts -verify`.
      # Fail loudly here if openssl is missing so the keystone test can never
      # turn green-but-skipped; BIRDBRAIN_REQUIRE_OPENSSL=1 enforces the same in-test.
      - name: Verify openssl is available
        run: openssl version

      # Runs the suite under coverage so the thresholds in vitest.config.ts are
      # actually evaluated. They were defined long before this and never ran in
      # CI, because `pnpm test` omits --coverage and vitest only checks
      # thresholds when coverage is enabled.
      - run: pnpm test:coverage
        env:
          BIRDBRAIN_REQUIRE_OPENSSL: '1'

      # Project-wide thresholds stop the tree backsliding but cannot ask whether
      # new code arrived tested — a PR can add an untested module and still clear
      # them. This scores only the lines the PR changed.
      - name: Diff coverage
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          node scripts/diff-coverage.mjs --base "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build Electron app
        run: pnpm build

      - name: Build Chrome extension
        run: pnpm build:extension

  e2e:
    runs-on: ubuntu-latest
    # A startup hang does not crash anything here, it makes every test burn its full
    # timeout: the green job runs ~5m, the wedged ones ran 2h24m each (32 specs x 3
    # attempts x ~90s). Bound the blast radius of the next one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 \
            libgtk-3-0 libnotify-dev libnss3 libxss1 \
            libasound2t64 libxtst6 xauth libgbm1 libsecret-1-0 \
            dbus-x11 gnome-keyring

      - run: pnpm install

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Build app
        run: pnpm build

      # initSigningKey() runs in whenReady(), before createWindow() (#414). With no
      # OS credential store it falls back to a blocking dialog.showMessageBoxSync()
      # acknowledgement prompt that nothing on a headless runner can click, wedging
      # startup before the first window ever opens — every e2e test then times out
      # identically on electronApplication.firstWindow(). A real (if freshly minted)
      # login keyring makes safeStorage.isEncryptionAvailable() report true so the
      # gate takes its normal non-blocking path, same as a real Linux desktop.
      #
      # --daemonize --unlock, not PAM's --login: --login "does not complete actual
      # initialization" and expects a later `gnome-keyring-daemon --start` to finish
      # the job (man gnome-keyring-daemon), which only works if that second process
      # can find the first one's control socket. --unlock creates the login keyring
      # when none exists and the daemon initializes itself, so it owns
      # org.freedesktop.secrets on the session bus before anything asks for a secret.
      # XDG_CURRENT_DESKTOP=GNOME is what makes Chromium's os_crypt backend probe the
      # libsecret store at all instead of defaulting to "unavailable".
      - name: Start D-Bus session and unlock a keyring
        run: |
          set -euo pipefail

          # gnome-keyring keeps its control socket under $XDG_RUNTIME_DIR/keyring and
          # every later daemon invocation — including the one D-Bus autoactivates for
          # org.freedesktop.secrets — finds the running daemon through that path. A
          # runner with no logind session can leave the variable unset or pointing at
          # a directory that does not exist, and the daemon then fails to bind the
          # socket with nothing but a warning, so own the value instead of inheriting
          # whatever the image happens to provide.
          if [ -z "${XDG_RUNTIME_DIR:-}" ] || [ ! -w "${XDG_RUNTIME_DIR}" ]; then
            XDG_RUNTIME_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/xdg-runtime-XXXXXX")"
            export XDG_RUNTIME_DIR
          fi
          chmod 700 "$XDG_RUNTIME_DIR"

          # Assign, then eval: `eval "$(cmd)"` reports eval's own status, so a failing
          # or silent cmd leaves the step green. An assignment propagates the failure.
          dbus_env="$(dbus-launch --sh-syntax)"
          eval "$dbus_env"
          : "${DBUS_SESSION_BUS_ADDRESS:?dbus-launch produced no session bus address}"

          keyring_env="$(printf '\n' | gnome-keyring-daemon --daemonize --unlock \
            --components=secrets,pkcs11,ssh)"
          eval "$keyring_env"

          {
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
            echo "XDG_CURRENT_DESKTOP=GNOME"
          } >> "$GITHUB_ENV"
          # The daemon only prints this when it picked a non-default control
          # directory; exporting an empty value would just mislead later steps.
          if [ -n "${GNOME_KEYRING_CONTROL:-}" ]; then
            echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
          fi

      # The step above is only worth having if its failure is loud. A keyring that
      # never came up fails nothing by itself — it turns every e2e test into a 90s
      # timeout, which is how one broken setup burned 2h24m of runner time. Ask
      # Electron the same question the app asks, with the env the tests will get, and
      # stop here in seconds if the answer is no.
      - name: Verify Electron can reach the credential store
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/safe-storage-probe.js" <<'PROBE'
          const { app, safeStorage } = require('electron')

          // app.exit() does not wind down the GPU process, and an orphan of it can
          // hold this step's stdout open after the probe has answered. Never start one.
          app.disableHardwareAcceleration()

          app.whenReady().then(() => {
            const available = safeStorage.isEncryptionAvailable()
            const backend = safeStorage.getSelectedStorageBackend()
            console.log(`isEncryptionAvailable=${available} backend=${backend}`)
            app.exit(available ? 0 : 1)
          })
          PROBE
          # Same reason for the redirect: a file cannot be held open by a stray child.
          status=0
          timeout 120 xvfb-run --auto-servernum npx electron --no-sandbox "$RUNNER_TEMP/safe-storage-probe.js" \
            > "$RUNNER_TEMP/safe-storage-probe.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/safe-storage-probe.log"
          exit "$status"

      - name: Run E2E tests
        run: xvfb-run --auto-servernum npx playwright test
