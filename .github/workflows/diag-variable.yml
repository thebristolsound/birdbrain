name: Diag variable read

on:
  push:
    branches: [diag/curator-variable-read]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create a marker-holder issue
        continue-on-error: true
        run: |
          set +e
          n="$(gh issue create --title 'diag: marker holder, delete me' --body 'seed' --json number --jq .number 2>&1)"
          echo "create rc=$? n=[$n]"
          echo "N=$n" >> "$GITHUB_ENV"

      - name: Write a SHA into the body
        continue-on-error: true
        run: |
          set +e
          gh issue edit "$N" --body "0123456789abcdef0123456789abcdef01234567"
          echo "edit rc=$?"

      - name: Read it back
        continue-on-error: true
        run: |
          set +e
          body="$(gh issue view "$N" --json body --jq .body)"
          echo "read rc=$? body=[$body]"

      - name: Close it
        continue-on-error: true
        run: |
          set +e
          gh issue close "$N" --reason 'not planned'
          echo "close rc=$?"
