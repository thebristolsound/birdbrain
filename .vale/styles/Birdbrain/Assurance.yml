extends: existence
message: "'%s' is an unqualified assurance word. Name the standard and its version, or describe the property the mechanism proves and the one it does not."
link: https://github.com/thebristolsound/birdbrain/blob/main/docs/agents/writing-guide.md#claim-discipline
level: warning
ignorecase: true
tokens:
  - tamper-?proof
  - court-admissible
  - legally admissible
  - forensically sound
  - military-grade
  - bank-grade
  - unhackable
  - unbreakable
  - bulletproof
  - 100% secure
  - fully secure
  - guarantees? (?:integrity|authenticity|admissibility)
