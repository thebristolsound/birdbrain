<!-- @dsCard group="Overlays" height=300 subtitle="Static rendition of dialog.tsx" -->
<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:var(--color-canvas);color:var(--color-text-secondary);font-family:var(--font-body);font-size:12px;line-height:16px}
  .wrap{padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
  .eyebrow{font-family:var(--font-display);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--color-text-faint);line-height:1}
  svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>
<style>
  .stage{position:relative;height:300px;background:var(--color-canvas)}
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.5)}
  .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .dialog{width:100%;max-width:28rem;padding:24px;border-radius:var(--radius-2xl);background:var(--color-elevated);border:1px solid var(--color-border);box-shadow:var(--shadow-overlay)}
  .head{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .title{font:600 14px/20px var(--font-body);color:var(--color-text-primary);margin:0}
  .desc{font:400 14px/20px var(--font-body);color:var(--color-text-muted);margin:0}
  .foot{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
  .btn{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:var(--radius-md);font:500 12px/16px var(--font-body);border:1px solid transparent;background:transparent}
  .ghost{color:var(--color-text-muted)} .destructive{background:var(--color-red-600);color:#fff}
</style></head><body>
<div class="stage"><div class="overlay"></div><div class="center">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="t">
    <div class="head"><h3 class="title" id="t">Delete 3 captures?</h3><p class="desc">Each deletion writes a manifest entry attributed to you. The files leave the case directory and cannot be recovered from Birdbrain.</p></div>
    <div class="foot"><button class="btn ghost">Cancel</button><button class="btn destructive">Delete captures</button></div>
  </div>
</div></div>
</body></html>
