name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      # Scans every commit on every ref, not just the pushed branch, so a secret
      # committed to any historical branch fails the build. Known false positives
      # are allowlisted by fingerprint in .gitleaksignore.
      - name: Scan git history
        run: ./gitleaks git --log-opts="--all" --redact --no-banner --verbose

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      # No `cache: pnpm` here: this job never installs, so the pnpm store is only
      # present when the cache restore hits. On a lockfile-changing PR the key
      # misses and setup-node's post-run save fails the job on the missing path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Advisory-only: the tree currently carries known high-severity advisories
      # (sharp < 0.35.0 libvips CVEs, fast-uri via electron-builder). Drop
      # continue-on-error once those are resolved so regressions fail the build.
      - name: pnpm audit
        run: pnpm audit --audit-level high
        continue-on-error: true
