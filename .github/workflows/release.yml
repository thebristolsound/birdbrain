name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

  build-app:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest now resolves to a VS 2026 (v18) image that node-gyp <12.1
          # can't detect, breaking the better-sqlite3 native build. Pin to windows-2022
          # until pnpm ships node-gyp >=12.1 (pnpm/pnpm#10268).
          - os: windows-2022
            script: package:win
            glob: |
              dist/*.exe
              dist/*.blockmap
              dist/*.yml
          - os: macos-latest
            script: package:mac
            glob: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/*-mac.yml
          - os: ubuntu-latest
            script: package:linux
            glob: |
              dist/*.{AppImage,deb}
              dist/*-linux.yml

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Python setuptools (needed for node-gyp)
        run: python3 -m pip install --break-system-packages setuptools || pip3 install --break-system-packages setuptools || true

      - run: pnpm install

      - name: Build and package
        run: pnpm ${{ matrix.script }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: ${{ matrix.glob }}
          # Fail loudly if any expected artifact (installer, blockmap, or the
          # latest*.yml update manifest) is missing rather than shipping a
          # partial, broken electron-updater feed with no CI signal.
          fail_on_unmatched_files: true

  build-extension:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install

      - name: Build Chrome extension
        run: pnpm build:extension

      - name: Zip extension
        run: mkdir -p dist && cd extension/dist && zip -r ../../dist/birdbrain-extension.zip .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: dist/birdbrain-extension.zip
